
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Contrato Aluguel Completo</title>
<style>body{font-family:Arial;max-width:700px;margin:20px auto;padding:15px}input,select{width:100%;padding:8px;margin:4px 0 10px}button{background:#009ee3;color:#fff;padding:12px;width:100%;border:0;border-radius:6px;font-size:16px;cursor:pointer}#pixBox{display:none;border:2px solid #00a650;padding:15px;border-radius:10px;text-align:center;margin-top:20px}#pixBox img{max-width:250px}</style>
</head><body>
<h2>Contrato Aluguel Completo</h2><p>Modelo 10 clausulas Lei 8.245/91 - <b>R$9,99 via PIX</b></p>
<form id="formContrato">
<h3>Locador</h3>
<input name="nomeLocador" placeholder="Nome Locador" required>
<input name="cpfLocador" placeholder="CPF Locador">
<h3>Locatario</h3>
<input name="nomeLocatario" placeholder="Nome Locatario *" required>
<input name="cpfLocatario" placeholder="CPF Locatario * (11144477735)" required>
<input name="emailLocatario" placeholder="Email Locatario *" required type="email">
<h3>Imovel</h3>
<input name="enderecoImovel" placeholder="Endereco Imovel *" required>
<input name="tipoImovel" placeholder="Tipo (Casa/Apto)">
<input name="valorAluguel" placeholder="Valor Aluguel *" required>
<input name="vencimento" placeholder="Vencimento dia">
<input name="prazoMeses" placeholder="Prazo meses">
<input name="dataInicio" placeholder="Data inicio">
<input name="cidade" placeholder="Cidade">
<button type="submit">Gerar PIX R$9,99</button>
</form>

<div id="pixBox">
<h3>✅ PIX Gerado! Pague para liberar</h3>
<img id="qrImg" src="">
<p><b>Copia e cola PIX:</b></p>
<textarea id="qrCode" style="width:100%;height:80px"></textarea>
<p id="statusPix">⏳ Aguardando pagamento... verificando a cada 3s</p>
<button id="btnBaixar" style="display:none;background:#00a650">⬇️ Baixar Contrato PDF</button>
</div>

<script>
let refAtual = null;
let intervalo = null;

document.getElementById('formContrato').onsubmit = async (e)=>{
  e.preventDefault();
  const dados = Object.fromEntries(new FormData(e.target).entries());
  const btn = e.target.querySelector('button');
  btn.textContent = 'Gerando PIX...';
  btn.disabled = true;
  
  try{
    const r = await fetch('/criar-pagamento',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)});
    const j = await r.json();
    if(j.error) throw new Error(j.error);
    
    refAtual = j.external_reference;
    console.log('PIX:', j);
    
    document.getElementById('qrImg').src = 'data:image/png;base64,' + j.qr_code_base64;
    document.getElementById('qrCode').value = j.qr_code;
    document.getElementById('pixBox').style.display = 'block';
    document.getElementById('formContrato').style.display = 'none';
    window.scrollTo(0,1000);
    
    // Começa verificar pagamento
    intervalo = setInterval(verificar, 3000);
    
  }catch(err){
    alert('Erro: '+err.message);
    btn.textContent = 'Gerar PIX R$9,99';
    btn.disabled = false;
  }
};

async function verificar(){
  if(!refAtual) return;
  const r = await fetch('/verificar-pagamento/'+refAtual);
  const j = await r.json();
  if(j.pago){
    clearInterval(intervalo);
    document.getElementById('statusPix').innerHTML = '✅ <b>Pagamento aprovado! Liberado!</b>';
    const btn = document.getElementById('btnBaixar');
    btn.style.display = 'block';
    btn.onclick = async ()=>{
      const resp = await fetch('/gerar-pdf/'+refAtual,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(document.getElementById('formContrato')).entries()))});
      if(resp.status===402){ alert('Ainda nao confirmado'); return; }
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='contrato.pdf'; a.click();
    };
  }
}
</script>
</body></html>
